name: Release

# Push a tag like v0.3.1 (matching `version` in main.go) to publish binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tag matches version in main.go
        run: |
          want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)
          if [ "v$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but main.go says $want"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for t in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; name=$os; ext=
            [ "$os" = darwin ] && name=macos
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/netcheck-$name-$arch$ext" .
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "netcheck $GITHUB_REF_NAME"
